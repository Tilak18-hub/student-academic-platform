apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-platform
  template:
    metadata:
      labels:
        app: student-platform
    spec:
      containers:
        - name: student-platform
          image: student-platform:v1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
